name: Publish changelog to WordPress

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Version to simulate, without a leading v
        required: true
        type: string
      release_tag:
        description: Existing Git tag that must contain this version
        required: true
        type: string
      release_commit:
        description: Full commit SHA expected for the tag
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: wordpress-changelog-${{ github.repository }}
  cancel-in-progress: false

jobs:
  synchronize:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.release.draft == false && github.event.release.prerelease == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: wordpress-publication
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
      RELEASE_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_version }}
      EXPECTED_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.release_commit || '' }}
      WP_ALLOWED_DOMAIN: ${{ vars.WP_ALLOWED_DOMAIN }}
    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag and checked-out commit
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${RELEASE_TAG#v}"
          requested_version="${RELEASE_VERSION#v}"
          if [ "$tag_version" != "$requested_version" ]; then
            echo "::error::Release tag and requested version do not match"
            exit 1
          fi
          git cat-file -e "refs/tags/${RELEASE_TAG}"'^{commit}'
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}"'^{commit}')"
          head_commit="$(git rev-parse 'HEAD^{commit}')"
          test "$tag_commit" = "$head_commit" || {
            echo "::error::Checked-out commit does not match the release tag"
            exit 1
          }
          if [ -n "$EXPECTED_COMMIT" ]; then
            if ! [[ "$EXPECTED_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::release_commit must be a full 40-character commit SHA"
              exit 1
            fi
            if [ "${head_commit,,}" != "${EXPECTED_COMMIT,,}" ]; then
              echo "::error::Release tag does not match the explicitly requested commit"
              exit 1
            fi
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-changelog.txt

      - name: Install changelog dependencies
        run: python -m pip install --requirement requirements-changelog.txt

      - name: Run tracked changelog tests
        run: python .github/ci/test_changelog_wordpress.py

      - name: Validate release metadata and changelog
        run: |
          set -euo pipefail
          test -n "$WP_ALLOWED_DOMAIN" || {
            echo "::error::Repository variable WP_ALLOWED_DOMAIN is missing"
            exit 1
          }
          python scripts/changelog_wordpress.py validate --version "$RELEASE_VERSION"

      - name: Test WordPress access in read-only mode
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: >-
          python scripts/changelog_wordpress.py connection-test
          --allowed-domain "$WP_ALLOWED_DOMAIN"

      - name: Simulate the complete synchronization
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: >-
          python scripts/changelog_wordpress.py sync
          --version "$RELEASE_VERSION"
          --allowed-domain "$WP_ALLOWED_DOMAIN"
          --dry-run

      - name: Publish only a stable GitHub Release
        if: >-
          github.event_name == 'release' &&
          github.event.release.draft == false &&
          github.event.release.prerelease == false
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: >-
          python scripts/changelog_wordpress.py sync
          --version "$RELEASE_VERSION"
          --allowed-domain "$WP_ALLOWED_DOMAIN"
          --publish

      - name: Upload non-sensitive preview
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: changelog-preview-${{ github.run_id }}
          path: |
            .changelog-preview/changelog-entry.html
            .changelog-preview/summary.json
          if-no-files-found: ignore
          retention-days: 14
